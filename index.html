<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SamKaran Traveller | Explore Uttarakhand</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#f4f4f4;
color:#222;
}

header{
height:100vh;
background:linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,.5)),
url("https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1600&q=80");
background-size:cover;
background-position:center;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
color:white;
}

.hero h1{
font-size:55px;
margin-bottom:20px;
}

.hero p{
font-size:22px;
margin-bottom:30px;
}

.btn{
display:inline-block;
padding:15px 35px;
background:#ff9800;
color:white;
text-decoration:none;
border-radius:40px;
font-size:20px;
font-weight:bold;
transition:.3s;
}

.btn:hover{
background:#ff6f00;
}

section{
padding:70px 10%;
}

.title{
text-align:center;
font-size:40px;
margin-bottom:40px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:25px;
}

.card{
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.15);
text-align:center;
}

.card h3{
margin:15px 0;
}

footer{
background:#111;
color:white;
padding:30px;
text-align:center;
}
</style>

</head>

<body>

<header>

<div class="hero">

<h1>SamKaran Traveller</h1>

<p>Explore Uttarakhand With Us</p>

<a href="#" class="btn">Book Your Tour</a>

</div>

</header>

<section>

<h2 class="title">Popular Tour Packages</h2>

<div class="cards">

<div class="card">
<h3>Kedarnath Tour</h3>
<p>3 Days / 2 Nights</p>
</div>

<div class="card">
<h3>Char Dham Yatra</h3>
<p>7 Days / 6 Nights</p>
</div>

<div class="card">
<h3>Rishikesh Adventure</h3>
<p>2 Days / 1 Night</p>
</div>

</div>

</section>

<footer>

<h2>SamKaran Traveller</h2>

<p>© 2026 All Rights Reserved.</p>

</footer>

</body>
  </html>
